name: Publish oil booking

on:
  push:
    branches: [main]
    paths:
      - oil-booking-site.zip
      - .github/workflows/github-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare only the oil booking site
        run: |
          mkdir -p "$RUNNER_TEMP/oil-booking-site"
          unzip -q oil-booking-site.zip -d "$RUNNER_TEMP/oil-booking-site"
          test -f "$RUNNER_TEMP/oil-booking-site/index.html"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/oil-booking-site
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
